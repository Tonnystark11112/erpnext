name: Build ERPNext v16 base image

# Builds Frappe v16 + the apps listed in apps.json for linux/amd64 and pushes it to GHCR.
# Uses frappe_docker's images/custom/Containerfile, which reads apps.json from the BuildKit secret apps_json.
# Railway then uses it as BASE_IMAGE for the wrapper in the repo-root Dockerfile.
#
# frappe_docker (current main) passes apps.json as a BuildKit SECRET (id=apps_json),
# not as the old APPS_JSON_BASE64 build-arg, which is now ignored.
# The build FAILS if apps.json is missing/empty, and the :v16 tag is only moved after the
# finished image has been checked to really contain the apps.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps.json
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

env:
  FRAPPE_BRANCH: version-16
  PYTHON_VERSION: "3.14.0"   # Frappe v16 needs Python 3.14
  NODE_VERSION: "24.11.0"    # Frappe v16 needs Node 24

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this repo (apps.json)
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (build recipe)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Validate apps.json (fail loudly if missing or empty)
        run: |
          test -s apps.json || { echo "::error::apps.json is missing or empty (file name is case-sensitive)"; ls -la; exit 1; }
          python3 - <<'PY'
          import json
          apps = json.load(open("apps.json"))
          assert isinstance(apps, list) and apps, "apps.json must be a non-empty JSON list"
          for a in apps:
              print("app:", a["url"], a["branch"])
          PY

      - name: Show which build recipe is used (for debugging)
        run: |
          ls -la frappe_docker/images
          grep -n "apps_json\|APPS_JSON\|type=secret" frappe_docker/images/custom/Containerfile || true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: prep
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecolattice-erp" >> "$GITHUB_OUTPUT"

      - name: Build and push (commit tag only)
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          secret-files: |
            apps_json=apps.json
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.prep.outputs.image }}:${{ github.sha }}

      - name: Verify the image really contains every app in apps.json
        run: |
          IMG="${{ steps.prep.outputs.image }}:${{ github.sha }}"
          docker pull "$IMG"
          docker run --rm "$IMG" bash -c '
            cd /home/frappe/frappe-bench
            echo "apps.txt:"; cat sites/apps.txt; echo
            env/bin/pip list 2>/dev/null | grep -iE "^(frappe|erpnext|hrms|crm|lms|payments|frappe-whatsapp|frappe_whatsapp) " || true
            env/bin/python -c "import frappe, erpnext, hrms, crm, lms, payments, frappe_whatsapp; print(\"OK frappe\", frappe.__version__, \"erpnext\", erpnext.__version__, \"hrms\", hrms.__version__)"
          '

      - name: Move the v16 tag to the verified image
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.prep.outputs.image }}:v16" \
            "${{ steps.prep.outputs.image }}:${{ github.sha }}"
