name: Build ERPNext v16 base image

# Builds Frappe v16 + ERPNext + HRMS (same branches as the Oracle build, minus
# crm / payments / lms / frappe_whatsapp) and pushes it to GHCR for linux/amd64.
# Railway then uses it as BASE_IMAGE for the wrapper in the repo-root Dockerfile.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps.json
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

env:
  FRAPPE_BRANCH: version-16
  PYTHON_VERSION: "3.14.0"   # Frappe v16 needs Python 3.14
  NODE_VERSION: "24.11.0"    # Frappe v16 needs Node 24

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (apps.json)
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (build recipe)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build inputs
        id: prep
        run: |
          echo "apps_b64=$(base64 -w0 apps.json)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecolattice-erp" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            APPS_JSON_BASE64=${{ steps.prep.outputs.apps_b64 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.prep.outputs.image }}:v16
            ${{ steps.prep.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
